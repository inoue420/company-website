<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メールアドレスの確認 | SMARTBUKATSU</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    p {
      line-height: 1.7;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      background: #0b63ce;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status {
      margin-top: 20px;
      font-size: 15px;
    }

    .success {
      color: #147a3d;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>メールアドレスの確認</h1>

      <p id="message">
        下のボタンを押して、メールアドレスの確認を完了してください。
      </p>

      <button id="verifyButton" class="button">
        メールアドレスを確認する
      </button>

      <div id="status" class="status"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      applyActionCode
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const params = new URLSearchParams(window.location.search);

    const mode = params.get("mode");
    const oobCode = params.get("oobCode");
    const apiKey = params.get("apiKey");

    const button = document.getElementById("verifyButton");
    const message = document.getElementById("message");
    const status = document.getElementById("status");

    if (!apiKey || !oobCode || mode !== "verifyEmail") {
      button.style.display = "none";
      message.textContent =
        "この確認リンクは無効です。アプリから確認メールを再送してください。";
      status.className = "status error";
    } else {
      const app = initializeApp({
        apiKey: apiKey
      });

      const auth = getAuth(app);

      button.addEventListener("click", async () => {
        button.disabled = true;
        button.textContent = "確認しています…";
        status.textContent = "";

        try {
          await applyActionCode(auth, oobCode);

          message.textContent =
            "メールアドレスの確認が完了しました。";

          status.textContent =
            "SMARTBUKATSUアプリに戻ってログインしてください。";

          status.className = "status success";

          button.style.display = "none";

        } catch (error) {
          console.error(error);

          message.textContent =
            "メールアドレスを確認できませんでした。";

          status.textContent =
            "リンクの有効期限が切れているか、すでに使用されている可能性があります。アプリから確認メールを再送してください。";

          status.className = "status error";

          button.style.display = "none";
        }
      });
    }
  </script>
</body>
</html>
