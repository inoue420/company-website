<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMARTBUKATSU アカウント確認</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 36px 28px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .brand {
      margin-bottom: 24px;
      font-size: 15px;
      font-weight: 700;
      color: #0b63ce;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
      line-height: 1.4;
    }

    p {
      margin: 10px 0;
      color: #555;
      line-height: 1.8;
    }

    .email {
      margin: 18px 0;
      padding: 12px;
      background: #f3f6fa;
      border-radius: 8px;
      word-break: break-all;
      font-weight: 600;
    }

    .button {
      width: 100%;
      margin-top: 20px;
      padding: 14px 20px;
      border: 0;
      border-radius: 8px;
      background: #0b63ce;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:hover {
      opacity: 0.92;
    }

    .button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .input {
      width: 100%;
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid #ccd3dd;
      border-radius: 8px;
      font-size: 16px;
    }

    .input:focus {
      outline: 2px solid rgba(11, 99, 206, 0.18);
      border-color: #0b63ce;
    }

    .status {
      margin-top: 20px;
      line-height: 1.7;
    }

    .success {
      color: #147a3d;
    }

    .error {
      color: #c62828;
    }

    .hidden {
      display: none;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">

      <div class="brand">SMARTBUKATSU</div>

      <h1 id="title">確認しています</h1>

      <p id="message">
        しばらくお待ちください。
      </p>

      <div id="emailBox" class="email hidden"></div>

      <div id="passwordArea" class="hidden">
        <input
          id="password"
          class="input"
          type="password"
          autocomplete="new-password"
          placeholder="新しいパスワード"
        >

        <input
          id="passwordConfirm"
          class="input"
          type="password"
          autocomplete="new-password"
          placeholder="新しいパスワード（確認）"
        >
      </div>

      <button id="actionButton" class="button hidden"></button>

      <div id="status" class="status"></div>

      <p class="note">
        SMARTBUKATSU / SharpRise
      </p>

    </section>
  </main>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      applyActionCode,
      checkActionCode,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const params = new URLSearchParams(window.location.search);

    const mode = params.get("mode");
    const oobCode = params.get("oobCode");
    const apiKey = params.get("apiKey");
    const continueUrl = params.get("continueUrl");


    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const emailBox = document.getElementById("emailBox");
    const button = document.getElementById("actionButton");
    const status = document.getElementById("status");
    const passwordArea = document.getElementById("passwordArea");
    const passwordInput = document.getElementById("password");
    const passwordConfirm =
      document.getElementById("passwordConfirm");


    function showError(text) {
      title.textContent = "処理できませんでした";
      message.textContent = text;
      status.textContent =
        "アプリから新しいメールを送信して、もう一度お試しください。";
      status.className = "status error";

      button.classList.add("hidden");
      passwordArea.classList.add("hidden");
    }


    function showSuccess(titleText, messageText) {
      title.textContent = titleText;
      message.textContent = messageText;
      status.textContent = "";
      status.className = "status success";

      button.classList.add("hidden");
      passwordArea.classList.add("hidden");
      emailBox.classList.add("hidden");
    }


    if (!apiKey || !oobCode || !mode) {

      showError(
        "このリンクは無効です。"
      );

    } else {

      const app = initializeApp({
        apiKey: apiKey
      });

      const auth = getAuth(app);


      switch (mode) {

        /*
         * メールアドレス確認
         */
        case "verifyEmail":

          title.textContent =
            "メールアドレスの確認";

          message.textContent =
            "下のボタンを押して、メールアドレスの確認を完了してください。";

          button.textContent =
            "メールアドレスを確認する";

          button.classList.remove("hidden");


          button.addEventListener(
            "click",
            async () => {

              button.disabled = true;
              button.textContent =
                "確認しています…";

              try {

                await applyActionCode(
                  auth,
                  oobCode
                );

                showSuccess(
                  "メールアドレスを確認しました",
                  "SMARTBUKATSUアプリに戻ってログインしてください。"
                );

              } catch (error) {

                console.error(error);

                showError(
                  "リンクの有効期限が切れているか、すでに使用されている可能性があります。"
                );
              }
            }
          );

          break;


        /*
         * パスワード再設定
         */
        case "resetPassword":

          try {

            const email =
              await verifyPasswordResetCode(
                auth,
                oobCode
              );

            title.textContent =
              "パスワードの再設定";

            message.textContent =
              "新しいパスワードを入力してください。";

            emailBox.textContent = email;
            emailBox.classList.remove("hidden");

            passwordArea.classList.remove("hidden");

            button.textContent =
              "パスワードを変更する";

            button.classList.remove("hidden");


            button.addEventListener(
              "click",
              async () => {

                const password =
                  passwordInput.value;

                const confirm =
                  passwordConfirm.value;


                if (password.length < 6) {

                  status.textContent =
                    "パスワードは6文字以上で入力してください。";

                  status.className =
                    "status error";

                  return;
                }


                if (password !== confirm) {

                  status.textContent =
                    "確認用パスワードが一致しません。";

                  status.className =
                    "status error";

                  return;
                }


                button.disabled = true;

                button.textContent =
                  "変更しています…";


                try {

                  await confirmPasswordReset(
                    auth,
                    oobCode,
                    password
                  );

                  showSuccess(
                    "パスワードを変更しました",
                    "新しいパスワードでSMARTBUKATSUにログインしてください。"
                  );

                } catch (error) {

                  console.error(error);

                  showError(
                    "パスワードを変更できませんでした。"
                  );
                }
              }
            );

          } catch (error) {

            console.error(error);

            showError(
              "このパスワード再設定リンクは無効か、有効期限が切れています。"
            );
          }

          break;


        /*
         * メールアドレス変更取り消し
         */
        case "recoverEmail":

          try {

            const info =
              await checkActionCode(
                auth,
                oobCode
              );

            const restoredEmail =
              info.data.email;

            title.textContent =
              "メールアドレス変更の取り消し";

            message.textContent =
              "メールアドレスの変更を取り消します。よろしければ下のボタンを押してください。";

            if (restoredEmail) {

              emailBox.textContent =
                restoredEmail;

              emailBox.classList.remove(
                "hidden"
              );
            }


            button.textContent =
              "メールアドレスを元に戻す";

            button.classList.remove(
              "hidden"
            );


            button.addEventListener(
              "click",
              async () => {

                button.disabled = true;

                button.textContent =
                  "処理しています…";


                try {

                  await applyActionCode(
                    auth,
                    oobCode
                  );

                  showSuccess(
                    "メールアドレスを元に戻しました",
                    "アカウントのメールアドレス変更を取り消しました。"
                  );

                } catch (error) {

                  console.error(error);

                  showError(
                    "メールアドレスを元に戻すことができませんでした。"
                  );
                }
              }
            );

          } catch (error) {

            console.error(error);

            showError(
              "このリンクは無効か、有効期限が切れています。"
            );
          }

          break;


        default:

          showError(
            "対応していない操作です。"
          );
      }
    }

  </script>
</body>
</html>
